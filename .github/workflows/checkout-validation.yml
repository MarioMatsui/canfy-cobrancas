name: Checkout validation

on:
  push:
    branches:
      - chatgpt-checkout-validation

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            checkout/package-lock.json
            backend/package-lock.json

      - name: Install checkout dependencies
        working-directory: checkout
        run: npm ci

      - name: Checkout lint
        working-directory: checkout
        run: npm run lint

      - name: Checkout TypeScript
        working-directory: checkout
        run: npm run typecheck

      - name: Checkout build
        working-directory: checkout
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Validate production compose
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/asaas_split
          ASAAS_API_KEY: ci-placeholder
          ASAAS_API_URL: https://sandbox.asaas.com/api/v3
          JWT_SECRET: ci-placeholder
          WEBHOOK_SECRET: ci-placeholder
          FRONTEND_URL: https://cobranca.canfy.com.br
          CHECKOUT_FRONTEND_URL: https://pagar.canfy.com.br
          NEXT_PUBLIC_API_URL: /api
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Install Playwright for smoke tests
        working-directory: checkout
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start mock backend
        working-directory: checkout
        run: |
          cat > .ci-mock-backend.cjs <<'EOF'
          const http = require('http');

          const base = {
            publicToken: '',
            orderStatus: 'READY',
            orderKind: 'PRODUCT',
            customerName: 'Mario Matsui',
            description: 'Pedido teste',
            items: [{ name: 'Produto teste', quantity: 1, unitPrice: 100, lineTotal: 100, fulfillmentType: 'NATIONAL' }],
            subtotal: 100,
            discountAmount: 10,
            shippingAmount: 20,
            totalAmount: 110,
            maxInstallments: 3,
            shipments: [{ type: 'NATIONAL', shippingAmount: 20, estimatedDaysMin: 3, estimatedDaysMax: 5 }],
            expiresAt: '2026-09-28T23:59:59.999Z'
          };

          const tokens = {
            product: '11111111-1111-4111-8111-111111111111',
            consultation: '22222222-2222-4222-8222-222222222222',
            pending: '33333333-3333-4333-8333-333333333333',
            paid: '44444444-4444-4444-8444-444444444444',
            missing: '55555555-5555-4555-8555-555555555555',
            gone: '66666666-6666-4666-8666-666666666666'
          };

          http.createServer((req, res) => {
            const token = req.url?.split('/').pop() || '';
            res.setHeader('Content-Type', 'application/json');
            res.setHeader('Cache-Control', 'no-store');

            if (token === tokens.missing) {
              res.statusCode = 404;
              return res.end(JSON.stringify({ message: 'Cobrança não encontrada' }));
            }
            if (token === tokens.gone) {
              res.statusCode = 410;
              return res.end(JSON.stringify({ message: 'Esta cobrança não está mais disponível' }));
            }

            let payload = { ...base, publicToken: token };
            if (token === tokens.consultation) {
              payload = {
                ...payload,
                orderKind: 'CONSULTATION',
                description: 'Consulta médica',
                items: [{ name: 'Consulta médica', quantity: 1, unitPrice: 100, lineTotal: 100 }],
                discountAmount: 0,
                shippingAmount: 0,
                totalAmount: 100,
                shipments: []
              };
            }
            if (token === tokens.pending) payload = { ...payload, orderStatus: 'PENDING_PAYMENT' };
            if (token === tokens.paid) payload = { ...payload, orderStatus: 'PAID' };

            res.statusCode = 200;
            res.end(JSON.stringify(payload));
          }).listen(3001, '127.0.0.1');
          EOF
          node .ci-mock-backend.cjs > /tmp/mock-backend.log 2>&1 &

      - name: Start checkout
        working-directory: checkout
        env:
          NEXT_PUBLIC_API_URL: /api
        run: |
          npm run start > /tmp/checkout.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4020/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/checkout.log
          exit 1

      - name: Browser smoke tests
        working-directory: checkout
        run: |
          cat > .ci-e2e.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = 'http://127.0.0.1:4020';
          const tokens = {
            product: '11111111-1111-4111-8111-111111111111',
            consultation: '22222222-2222-4222-8222-222222222222',
            pending: '33333333-3333-4333-8333-333333333333',
            paid: '44444444-4444-4444-8444-444444444444',
            missing: '55555555-5555-4555-8555-555555555555',
            gone: '66666666-6666-4666-8666-666666666666'
          };

          const browser = await chromium.launch({ headless: true });

          async function assertText(page, text) {
            await page.getByText(text, { exact: false }).first().waitFor({ state: 'visible' });
          }

          try {
            const desktop = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            await desktop.goto(`${base}/${tokens.product}`, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'confira seu pedido');
            await assertText(desktop, 'R$ 110,00');
            if (await desktop.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1)) {
              throw new Error('Desktop horizontal overflow detected');
            }
            await desktop.getByRole('button', { name: 'Continuar para entrega' }).click();
            await assertText(desktop, 'Endereço de entrega');

            await desktop.goto(`${base}/${tokens.consultation}`, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'confira seu pedido');
            await desktop.getByRole('button', { name: 'Continuar para pagamento' }).click();
            await assertText(desktop, 'Como você prefere pagar?');
            if (await desktop.getByText('Endereço de entrega', { exact: true }).count()) {
              throw new Error('Consultation rendered address step');
            }

            await desktop.goto(`${base}/${tokens.pending}`, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Pagamento em processamento');

            await desktop.goto(`${base}/${tokens.paid}`, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Pagamento confirmado');

            await desktop.goto(`${base}/${tokens.missing}`, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Não encontramos este pagamento');

            await desktop.goto(`${base}/${tokens.gone}`, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'não está mais disponível');

            const mobile = await browser.newPage({ viewport: { width: 375, height: 812 } });
            await mobile.goto(`${base}/${tokens.product}`, { waitUntil: 'domcontentloaded' });
            await assertText(mobile, 'confira seu pedido');
            if (await mobile.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1)) {
              throw new Error('Mobile horizontal overflow detected');
            }
            await mobile.getByRole('button', { name: 'Continuar para entrega' }).click();
            await assertText(mobile, 'Endereço de entrega');
            if (await mobile.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1)) {
              throw new Error('Mobile address horizontal overflow detected');
            }

            console.log('browser-smoke-tests: passed');
          } finally {
            await browser.close();
          }
          EOF
          node .ci-e2e.mjs
