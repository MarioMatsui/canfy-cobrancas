name: Checkout validation

on:
  push:
    branches:
      - master
      - chatgpt-checkout-validation
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            checkout/package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install checkout dependencies
        working-directory: checkout
        run: npm ci

      - name: Checkout lint
        working-directory: checkout
        run: npm run lint

      - name: Checkout TypeScript
        working-directory: checkout
        run: npm run typecheck

      - name: Checkout build
        working-directory: checkout
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Validate production compose
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/asaas_split
          ASAAS_API_KEY: ci-placeholder
          ASAAS_API_URL: https://sandbox.asaas.com/api/v3
          JWT_SECRET: ci-placeholder
          WEBHOOK_SECRET: ci-placeholder
          FRONTEND_URL: https://cobranca.canfy.com.br
          CHECKOUT_FRONTEND_URL: https://pagar.canfy.com.br
          NEXT_PUBLIC_API_URL: /api
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Install Playwright for smoke tests
        working-directory: checkout
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start mock backend
        working-directory: checkout
        run: |
          cat > .ci-mock-backend.cjs <<'EOF'
          const http = require('http');

          const qr =
            'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2QW0AAAAASUVORK5CYII=';
          const base = {
            publicToken: '',
            orderStatus: 'READY',
            orderKind: 'PRODUCT',
            customerName: 'Mario Matsui',
            description: 'Pedido teste',
            items: [
              {
                name: 'Produto teste',
                quantity: 2,
                unitPrice: 50,
                lineTotal: 100,
                fulfillmentType: 'NATIONAL'
              }
            ],
            subtotal: 100,
            discountAmount: 10,
            shippingAmount: 20,
            totalAmount: 110,
            maxInstallments: 3,
            shipments: [
              {
                type: 'NATIONAL',
                shippingAmount: 20,
                estimatedDaysMin: 3,
                estimatedDaysMax: 5
              }
            ],
            expiresAt: '2026-09-28T23:59:59.999Z',
            availablePayments: []
          };

          const tokens = {
            product: '11111111-1111-4111-8111-111111111111',
            paid: '44444444-4444-4444-8444-444444444444',
            missing: '55555555-5555-4555-8555-555555555555',
            gone: '66666666-6666-4666-8666-666666666666',
            mobileProduct: '77777777-7777-4777-8777-777777777777'
          };

          const state = new Map();

          function send(res, status, payload) {
            res.statusCode = status;
            res.setHeader('Content-Type', 'application/json');
            res.setHeader('Cache-Control', 'no-store');
            res.end(JSON.stringify(payload));
          }

          function currentState(token) {
            if (token === tokens.paid) {
              return { orderStatus: 'PAID', availablePayments: [] };
            }
            return state.get(token) || { orderStatus: 'READY', availablePayments: [] };
          }

          function chargeFor(token) {
            const current = currentState(token);
            return {
              ...base,
              publicToken: token,
              ...current,
              activePayment: current.availablePayments?.[0]
            };
          }

          function pixPayment() {
            return {
              method: 'PIX',
              status: 'PENDING',
              amount: 110,
              pixQrCode: qr,
              pixCopyPaste: '00020101021226890014BR.GOV.BCB.PIX5204000053039865406110.005802BR',
              pixExpirationDate: '2026-09-23T03:00:00.000Z'
            };
          }

          function cardPayment() {
            return {
              method: 'CARD',
              status: 'PENDING',
              amount: 110,
              invoiceUrl: 'http://127.0.0.1:4020/mock-card-destination'
            };
          }

          http.createServer((req, res) => {
            const url = new URL(req.url || '/', 'http://127.0.0.1:3001');

            if (req.method === 'POST' && url.pathname.startsWith('/__ci/mark-paid/')) {
              const token = url.pathname.split('/').filter(Boolean).pop();
              state.set(token, { orderStatus: 'PAID', availablePayments: [] });
              return send(res, 200, { ok: true });
            }

            const parts = url.pathname.split('/').filter(Boolean);
            const start = parts[parts.length - 1] === 'start';
            const token = start ? parts[parts.length - 2] : parts[parts.length - 1];

            if (token === tokens.missing) {
              return send(res, 404, { message: 'Cobrança não encontrada' });
            }
            if (token === tokens.gone) {
              return send(res, 410, { message: 'Esta cobrança não está mais disponível' });
            }

            if (req.method === 'POST' && start) {
              let body = '';
              req.on('data', (chunk) => {
                body += chunk;
              });
              req.on('end', () => {
                const parsed = JSON.parse(body || '{}');
                const current = currentState(token);

                if (current.orderStatus === 'PAID') {
                  return send(res, 200, { orderStatus: 'PAID' });
                }

                const existing = current.availablePayments.find(
                  (payment) => payment.method === parsed.method,
                );
                const activePayment =
                  existing ||
                  (parsed.method === 'PIX'
                    ? pixPayment()
                    : parsed.method === 'CARD'
                      ? cardPayment()
                      : null);

                if (!activePayment) {
                  return send(res, 400, { message: 'Método inválido' });
                }

                const availablePayments = existing
                  ? current.availablePayments
                  : [activePayment, ...current.availablePayments];
                state.set(token, {
                  orderStatus: 'PENDING_PAYMENT',
                  availablePayments
                });

                return send(res, 200, {
                  orderStatus: 'PENDING_PAYMENT',
                  activePayment
                });
              });
              return;
            }

            if (req.method === 'GET') {
              return send(res, 200, chargeFor(token));
            }

            return send(res, 405, { message: 'Method not allowed' });
          }).listen(3001, '127.0.0.1');
          EOF
          node .ci-mock-backend.cjs > /tmp/mock-backend.log 2>&1 &

      - name: Start checkout
        working-directory: checkout
        env:
          NEXT_PUBLIC_API_URL: /api
        run: |
          npm run start > /tmp/checkout.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4020/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/checkout.log
          exit 1

      - name: Browser smoke tests
        working-directory: checkout
        run: |
          cat > .ci-e2e.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = 'http://127.0.0.1:4020';
          const mock = 'http://127.0.0.1:3001';
          const tokens = {
            product: '11111111-1111-4111-8111-111111111111',
            paid: '44444444-4444-4444-8444-444444444444',
            missing: '55555555-5555-4555-8555-555555555555',
            gone: '66666666-6666-4666-8666-666666666666',
            mobileProduct: '77777777-7777-4777-8777-777777777777'
          };

          const browser = await chromium.launch({ headless: true });

          async function assertText(page, value) {
            await page.getByText(value, { exact: false }).first().waitFor({ state: 'visible' });
          }

          async function assertNoOverflow(page, label) {
            const overflow = await page.evaluate(
              () => document.documentElement.scrollWidth > window.innerWidth + 1,
            );
            if (overflow) throw new Error(label + ' horizontal overflow detected');
          }

          async function assertNoManualRefresh(page) {
            const count = await page.getByRole('button', { name: /Atualizar status/i }).count();
            if (count !== 0) throw new Error('Manual refresh button is still visible');
          }

          try {
            const desktopContext = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              permissions: ['clipboard-read', 'clipboard-write']
            });
            const desktop = await desktopContext.newPage();
            let startRequests = 0;
            desktop.on('request', (request) => {
              if (request.method() === 'POST' && request.url().endsWith('/start')) {
                startRequests += 1;
              }
            });

            const productUrl = base + '/' + tokens.product;
            await desktop.goto(productUrl, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Resumo do pedido');
            await assertText(desktop, 'R$ 110,00');
            await desktop.getByRole('button', { name: 'Pix' }).waitFor();
            await desktop.getByRole('button', { name: 'Cartão' }).waitFor();
            await assertNoOverflow(desktop, 'Desktop MENU');

            await desktop.getByRole('button', { name: 'Pix' }).click();
            await assertText(desktop, 'Pagamento via Pix');
            await desktop.getByAltText('QR Code Pix para pagamento').waitFor();
            await assertNoManualRefresh(desktop);
            const startsBeforePixReload = startRequests;
            await desktop.reload({ waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Pagamento via Pix');
            if (startRequests !== startsBeforePixReload) {
              throw new Error('Reloading PIX unexpectedly started a payment');
            }

            await desktop.getByRole('button', { name: 'Alterar forma de pagamento' }).click();
            await desktop.getByRole('button', { name: 'Cartão' }).waitFor();
            const startsBeforeCard = startRequests;
            const popupPromise = desktopContext.waitForEvent('page');
            await desktop.getByRole('button', { name: 'Cartão' }).click();
            const cardPopup = await popupPromise;
            await cardPopup.waitForURL('**/mock-card-destination');
            await assertText(desktop, 'Pagamento com cartão');
            if (desktop.url() !== productUrl) {
              throw new Error('Original CanFy tab navigated away during card payment');
            }
            if (startRequests !== startsBeforeCard + 1) {
              throw new Error('Card selection did not start exactly one request');
            }
            const openerIsNull = await cardPopup.evaluate(() => window.opener === null);
            if (!openerIsNull) throw new Error('Card popup kept window.opener');
            await cardPopup.close();
            await assertNoManualRefresh(desktop);

            const startsBeforeCardReload = startRequests;
            await desktop.reload({ waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Pagamento com cartão');
            if (startRequests !== startsBeforeCardReload) {
              throw new Error('Reloading CARD unexpectedly started a payment');
            }

            await desktop.getByRole('button', { name: 'Alterar forma de pagamento' }).click();
            await desktop.getByRole('button', { name: 'Pix' }).waitFor();
            const startsBeforeMenuReload = startRequests;
            await desktop.reload({ waitUntil: 'domcontentloaded' });
            await desktop.getByRole('button', { name: 'Pix' }).waitFor();
            await desktop.getByRole('button', { name: 'Cartão' }).waitFor();
            if (startRequests !== startsBeforeMenuReload) {
              throw new Error('Reloading MENU unexpectedly started a payment');
            }

            await desktop.getByRole('button', { name: 'Pix' }).click();
            await assertText(desktop, 'Pagamento via Pix');
            const startsBeforeBothReload = startRequests;
            await desktop.reload({ waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Pagamento via Pix');
            if (startRequests !== startsBeforeBothReload) {
              throw new Error('Reloading PIX with CARD also pending unexpectedly started a payment');
            }

            await desktopContext.request.post(mock + '/__ci/mark-paid/' + tokens.product);
            await desktop.evaluate(() => window.dispatchEvent(new Event('focus')));
            await assertText(desktop, 'Obrigado, Mario!');
            await assertText(desktop, 'Pagamento confirmado com sucesso');
            await assertText(desktop, 'Produto teste');
            await assertText(desktop, 'R$ 110,00');

            await desktop.reload({ waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Pagamento confirmado com sucesso');
            await assertText(desktop, 'Resumo do pedido');

            await desktop.goto(base + '/' + tokens.paid, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Pagamento confirmado com sucesso');
            await desktop.reload({ waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Pagamento confirmado com sucesso');

            await desktop.goto(base + '/' + tokens.missing, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'Não encontramos este pagamento');

            await desktop.goto(base + '/' + tokens.gone, { waitUntil: 'domcontentloaded' });
            await assertText(desktop, 'não está mais disponível');

            const mobileContext = await browser.newContext({
              viewport: { width: 375, height: 812 }
            });
            const mobile = await mobileContext.newPage();
            await mobile.goto(base + '/' + tokens.mobileProduct, { waitUntil: 'domcontentloaded' });
            await assertText(mobile, 'Resumo do pedido');
            await mobile.getByRole('button', { name: 'Pix' }).waitFor();
            await mobile.getByRole('button', { name: 'Cartão' }).waitFor();
            await assertNoOverflow(mobile, 'Mobile MENU');

            await mobile.getByRole('button', { name: 'Pix' }).click();
            await assertText(mobile, 'Pagamento via Pix');
            await mobile.getByAltText('QR Code Pix para pagamento').waitFor();
            await assertNoManualRefresh(mobile);
            await assertNoOverflow(mobile, 'Mobile PIX');

            await mobileContext.request.post(
              mock + '/__ci/mark-paid/' + tokens.mobileProduct,
            );
            // Sem focus/visibility manual: este caso valida o polling periodico
            // real (12 s) detectando PENDING_PAYMENT -> PAID.
            await assertText(mobile, 'Pagamento confirmado com sucesso');
            await assertNoOverflow(mobile, 'Mobile PAID');

            console.log('browser-smoke-tests: passed');
            await desktopContext.close();
            await mobileContext.close();
          } finally {
            await browser.close();
          }
          EOF
          node .ci-e2e.mjs
