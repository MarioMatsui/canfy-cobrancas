name: Medical Stage 3 (safe checks)
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/canfy_ci
      JWT_SECRET: ci-only-dummy-secret-never-used-for-live-auth
    timeout-minutes: 18
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --runInBand
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
